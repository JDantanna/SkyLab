[package]
name = "skylab-rust"
version = "0.5.0"
edition = "2024"
default-run = "skylab-rust"

[features]
installer = []

[[bin]]
name = "skylab-setup"
path = "src/bin/setup.rs"
required-features = ["installer"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
roxmltree = "0.21"
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
