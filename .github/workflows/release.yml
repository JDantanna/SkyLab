name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['BUILD_REVISION', '.github/workflows/release.yml', 'tests/**']
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: skylab-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate approved version
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --offline --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'skylab-rust').version
          $label = $version -replace '\.0$', ''
          $revision = [uint32](Get-Content -Raw BUILD_REVISION).Trim()
          $tag = "v$label-r$revision"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match approved version and build revision' }
          "SKYLAB_LABEL=$label" >> $env:GITHUB_ENV
          "SKYLAB_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Build and verify
        run: |
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          cargo clippy --all-targets --features installer --offline -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:SKYLAB_RELEASE_TAG
          $asset = "SkyTEM-SkyLab-Setup-$($tag.Substring(1)).exe"
          Copy-Item -LiteralPath dist/SkyTEM-SkyLab-Setup.exe -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLower()
          $package = "SkyLab-Update-$($tag.Substring(1)).zip"
          Compress-Archive -LiteralPath payload/SkyLab-Rust.exe -DestinationPath $package
          $packageHash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLower()
          @("$hash  $asset", "$packageHash  $package") | Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already published; keeping its original installer'; exit 0 }
          gh release create $tag $asset $package SHA256SUMS.txt --target $env:GITHUB_SHA --title "SkyLab $env:SKYLAB_LABEL" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Verify published native update download
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-update-download.ps1
